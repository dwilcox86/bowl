<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Pick a flavour and a protein, get a randomised bibimbap bowl you can swap segment by segment, with a shopping list and method.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%232b2e2c'/%3E%3Ccircle cx='32' cy='32' r='24' fill='%23f4f1e8'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%23f2a31a'/%3E%3C/svg%3E">
<title>Bibimbap Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a control rail, then the bench (stone bowl beside its segment list), then shopping list and method side by side */
:root{
  --paper:#edf1ed; --surface:#fafcf9; --ink:#1b211e; --muted:#5b6862; --line:#d3dcd5;
  --accent:#b5311e; --on-accent:#fff8f3; --celadon:#8fb3a0; --celadon-soft:#dfeae3;
  --stone:#2b2e2c; --stone-hi:#4b504d; --stone-lo:#121413; --shadow:rgba(28,40,34,.16);
  --f-display:'Gowun Batang','Iowan Old Style',Georgia,serif;
  --f-body:'Gowun Dodum','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111513; --surface:#191e1b; --ink:#e6ebe7; --muted:#97a59d; --line:#2b3430;
  --accent:#e2573f; --on-accent:#1c0c08; --celadon:#6f9a86; --celadon-soft:#21302a;
  --stone:#0e100f; --stone-hi:#3a3f3c; --stone-lo:#040505; --shadow:rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111513; --surface:#191e1b; --ink:#e6ebe7; --muted:#97a59d; --line:#2b3430;
  --accent:#e2573f; --on-accent:#1c0c08; --celadon:#6f9a86; --celadon-soft:#21302a;
  --stone:#0e100f; --stone-hi:#3a3f3c; --stone-lo:#040505; --shadow:rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 20px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:-.01em;margin:0}
.brand span{color:var(--accent)}
.tag{color:var(--muted);margin:0;font-size:.92rem}

/* controls */
.rail{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:end;
  padding-bottom:22px;border-bottom:1px solid var(--line)}
.pickers{display:flex;flex-direction:column;gap:14px;min-width:0}
fieldset{border:0;margin:0;padding:0;min-width:0}
legend,.lbl{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:0;margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;pointer-events:none}
.chip span{display:inline-block;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);
  cursor:pointer;transition:background .15s,border-color .15s,color .15s;font-size:.93rem}
.chip span:hover{border-color:var(--celadon)}
.chip input:checked+span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.act{display:flex;align-items:end;gap:14px;flex-wrap:wrap}
.serves{display:flex;flex-direction:column}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;background:var(--surface);overflow:hidden}
.stepper button{width:36px;height:36px;border:0;background:none;cursor:pointer;font-size:1.1rem}
.stepper button:hover{background:var(--celadon-soft)}
.stepper output{min-width:28px;text-align:center;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.shuffle{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 20px;border:0;border-radius:999px;
  background:var(--accent);color:var(--on-accent);cursor:pointer;font-weight:600;letter-spacing:.01em;transition:transform .15s}
.shuffle:hover{transform:translateY(-1px)}
.shuffle svg{width:17px;height:17px}

/* bench */
.bench{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:28px;align-items:start}
.plate{display:flex;flex-direction:column;gap:6px;min-width:0}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.9rem,4.2vw,3rem);line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.015em}
.meta{color:var(--muted);margin:2px 0 0;font-size:.92rem}
.bowl{width:100%;max-width:560px;margin:6px auto 0;display:block;height:auto;overflow:visible}
.seg{cursor:pointer;transition:transform .22s ease}
.seg:hover,.seg.on{transform:translate(var(--dx,0px),var(--dy,0px))}
.seg:focus{outline:none}
.seg:focus-visible .ring{stroke:var(--accent);stroke-width:3}
.ring{fill:none;stroke:transparent;stroke-width:3;pointer-events:none}
.seg.on .ring{stroke:var(--accent)}
.pop{animation:pop .45s ease}
@keyframes pop{from{opacity:.25}}
.hint{text-align:center;color:var(--muted);font-size:.85rem;margin:0}

.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line);min-width:0}
.list>li{border-bottom:1px solid var(--line)}
.rowtop{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px}
.open{display:grid;grid-template-columns:22px minmax(0,1fr);grid-column:1/3;align-items:center;gap:12px;text-align:left;
  background:none;border:0;padding:11px 4px;cursor:pointer;min-width:0}
.sw{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.cat{display:block;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.nm{display:block;font-size:1rem;line-height:1.3}
.dice{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;color:var(--muted);transition:color .15s,border-color .15s,transform .3s}
.dice:hover{color:var(--accent);border-color:var(--accent);transform:rotate(-30deg)}
.dice svg{width:16px;height:16px}
.list>li.on{background:var(--celadon-soft)}
.list>li.on .open{padding-left:10px}
.alts{display:flex;flex-wrap:wrap;gap:6px;padding:2px 10px 14px 44px}
.alt{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.86rem;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.alt i{width:10px;height:10px;border-radius:50%;display:inline-block}
.alt:hover{border-color:var(--ink)}
.alt[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.alt:disabled{opacity:.4;cursor:not-allowed}
.prep{grid-column:1/-1;margin:-4px 0 12px 44px;color:var(--muted);font-size:.88rem;max-width:58ch}

/* cards */
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:22px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 22px 24px;min-width:0}
.card h2{font-family:var(--f-display);font-weight:700;font-size:1.35rem;margin:0}
.cardhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.ghost{border:1px solid var(--line);background:none;border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.85rem}
.ghost:hover{border-color:var(--ink)}
.aisle{margin-top:16px}
.aisle h3{font-family:var(--f-mono);font-weight:500;font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.shop{list-style:none;margin:0;padding:0}
.shop label{display:grid;grid-template-columns:18px 76px minmax(0,1fr);gap:10px;align-items:baseline;padding:5px 0;cursor:pointer;border-bottom:1px dashed var(--line)}
.shop input{accent-color:var(--accent);margin:0;transform:translateY(2px)}
.q{font-family:var(--f-mono);font-size:.84rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.shop input:checked~span{text-decoration:line-through;opacity:.45}
.copybox{width:100%;min-height:160px;margin-top:12px;font-family:var(--f-mono);font-size:.8rem;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px}

.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:flex;flex-direction:column;gap:16px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px}
.steps li::before{content:counter(s);font-family:var(--f-display);font-weight:700;font-size:1.05rem;width:30px;height:30px;border-radius:50%;
  display:grid;place-items:center;background:var(--celadon-soft);color:var(--ink)}
.steps h4{margin:3px 0 2px;font-size:1rem;font-weight:700}
.steps p{margin:0;max-width:64ch}
.steps ul{margin:6px 0 0;padding-left:18px}
.steps ul li{display:list-item;margin:3px 0}
.steps ul li::before{content:none}
.kicker{margin:18px 0 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}

@media (max-width:900px){
  .bench,.duo{grid-template-columns:minmax(0,1fr)}
  .rail{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:480px){
  .card{padding:18px 16px 20px}
  .shop label{grid-template-columns:18px 64px minmax(0,1fr)}
  .alts,.prep{padding-left:0;margin-left:0}
  .alts{padding-left:10px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <p class="brand">Bibimbap <span>Builder</span></p>
    <p class="tag">비빔밥 · one bowl, any direction. Pick a style, then swap anything.</p>
  </header>

  <section class="rail" aria-label="Choose your bowl">
    <div class="pickers">
      <fieldset><legend>Flavour</legend><div class="chips" id="cuisines"></div></fieldset>
      <fieldset><legend>Protein</legend><div class="chips" id="proteins"></div></fieldset>
    </div>
    <div class="act">
      <div class="serves"><span class="lbl" id="servesLbl">Serves</span>
        <div class="stepper" role="group" aria-labelledby="servesLbl">
          <button type="button" id="less" aria-label="Fewer serves">−</button>
          <output id="serves" aria-live="polite">2</output>
          <button type="button" id="more" aria-label="More serves">+</button>
        </div>
      </div>
      <button class="shuffle" type="button" id="shuffle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/></svg>
        Shuffle bowl
      </button>
    </div>
  </section>

  <section class="bench">
    <div class="plate">
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="title"></h1>
      <p class="meta" id="meta"></p>
      <div id="bowlWrap"></div>
      <p class="hint">Tap a segment to swap it.</p>
    </div>
    <div style="min-width:0">
      <p class="lbl" style="margin-top:8px">In the bowl</p>
      <ul class="list" id="legend"></ul>
    </div>
  </section>

  <section class="duo">
    <div class="card">
      <div class="cardhead"><h2>Shopping list</h2><button class="ghost" type="button" id="copy">Copy list</button></div>
      <div id="shop"></div>
      <textarea class="copybox" id="copybox" readonly hidden aria-label="Shopping list text"></textarea>
    </div>
    <div class="card">
      <div class="cardhead"><h2>Method</h2></div>
      <ol class="steps" id="steps"></ol>
      <p class="kicker">Bibim means mixed. Bring the bowl to the table looking neat, then stir it all together before the first bite.</p>
    </div>
  </section>
</div>

<script>
/* ---------- data ---------- */
const AISLES={P:'Fruit & veg',M:'Butcher & seafood',E:'Fridge & eggs',R:'Rice & grains',I:'Specialty aisle',S:'Pantry'};
const AISLE_ORDER=['P','M','E','R','I','S'];
const O=(n,c,t,p,i,x={})=>Object.assign({n,c,t,p,i},x);
const EGG_FRIED=O('Fried egg','#fbf7ec','egg','Fry sunny-side up in a little oil until the white is set and the edges crisp.',['2|egg{s}|E']);
const EGG_JAMMY=O('Jammy soft egg','#fbf7ec','jammy','Boil 6½ minutes, cool in iced water, peel and halve.',['2|egg{s}|E']);

const PROTEINS={
  beef:{n:'Beef',w:'beef',c:'#6e3524',t:'chunk',i:['300 g|beef scotch fillet|M'],cut:'Slice the beef as thinly as you can across the grain (15 minutes in the freezer helps).',cook:'Sear in batches over high heat, about a minute a side, until caramelised.'},
  chicken:{n:'Chicken',w:'chicken',c:'#c4874a',t:'chunk',i:['350 g|chicken thigh fillets|M'],cut:'Cut the thighs into bite-size pieces.',cook:'Cook over medium-high heat for 6–8 minutes, turning, until cooked through and charred at the edges.'},
  pork:{n:'Pork',w:'pork',c:'#ae5f3c',t:'chunk',i:['300 g|pork neck|M'],cut:'Slice the pork thinly.',cook:'Sear 2–3 minutes a side until caramelised and cooked through.'},
  prawns:{n:'Prawns',w:'prawns',c:'#ef8a5d',t:'curl',i:['300 g|raw peeled prawns|M'],cut:'Devein the prawns and pat them dry.',cook:'Sear over high heat 1–2 minutes a side until just pink.'},
  tofu:{n:'Tofu',w:'tofu',c:'#e6c487',t:'cube',plant:true,i:['300 g|firm tofu|E'],cut:'Press the tofu for 15 minutes, then cut into 2 cm cubes.',cook:'Pan-fry the tofu in a little oil until golden on all sides.'},
  mushrooms:{n:'Mushrooms',w:'mushrooms',c:'#9d7650',t:'mush',plant:true,i:['300 g|king oyster mushrooms|P'],cut:'Tear or thickly slice the mushrooms.',cook:'Sear the mushrooms in a hot, dry pan until well browned.'}
};

const CUISINES=[
{id:'korean',n:'Traditional',sub:'Korean classic',style:'Bulgogi',glaze:'#6a2414',
 mar:{how:'Grate the pear and garlic into the soy, brown sugar and sesame oil.',i:['2 tbsp|soy sauce|S','1 tbsp|brown sugar|S','2 tsp|sesame oil|S','2|garlic clove{s}|P','0.25|nashi pear{s}|P']},
 base:[
  O('Short-grain white rice','#f4f1e8','rice','Rinse until the water runs clear, then cook with 1.1 parts water. Rest 10 minutes covered.',['1 cup|short-grain rice|R']),
  O('Multigrain japgokbap','#e2d6c4','rice','Soak the rice and grains 30 minutes, then cook with a splash more water than usual.',['0.75 cup|short-grain rice|R','0.25 cup|mixed grains (barley, black rice)|R'],{fleck:'#4b2338'}),
  O('Crispy dolsot rice','#efdcb8','rice','Cook the rice, press into an oiled very hot pan or stone bowl and leave 5 minutes until a golden crust forms.',['1 cup|short-grain rice|R','1 tbsp|sesame oil|S'],{fleck:'#c58a3c'})],
 veg:[
  O('Seasoned spinach','#2f6b2f','leaf','Blanch 30 seconds, squeeze dry, toss with sesame oil, garlic and a pinch of salt.',['1 bunch|English spinach|P','1 tsp|sesame oil|S','1|garlic clove{s}|P']),
  O('Soybean sprouts','#efe3ae','sprout','Boil 5 minutes with the lid on, drain, dress with sesame oil and salt.',['150 g|soybean sprouts|P','1 tsp|sesame oil|S']),
  O('Sautéed carrot','#e8742a','strip','Julienne and stir-fry 1 minute with a pinch of salt.',['1|carrot{s}|P']),
  O('Zucchini half-moons','#9cbf5a','slice','Slice thinly, salt 10 minutes, pat dry and sauté until just soft.',['1|zucchini|P']),
  O('Shiitake','#5e3b26','mush','Slice and stir-fry with a splash of soy and sugar until glossy.',['6|fresh shiitake mushroom{s}|P','1 tsp|soy sauce|S']),
  O('Kimchi','#c8381f','shred','Snip into bite-size pieces. Fry 2 minutes if you like it softer.',['120 g|cabbage kimchi|E']),
  O('Gosari','#6b4a2b','strip','Rehydrate, simmer 15 minutes, then stir-fry with soy, garlic and sesame oil.',['30 g|dried gosari (fernbrake)|I','1 tsp|soy sauce|S','1|garlic clove{s}|P']),
  O('Cucumber namul','#7fb069','slice','Slice thinly, salt 10 minutes, squeeze, then dress with gochugaru and sesame.',['1|Lebanese cucumber{s}|P','0.5 tsp|gochugaru|I']),
  O('Spicy radish','#e7b4a2','strip','Julienne the daikon and toss with gochugaru, vinegar, sugar and salt.',['150 g|daikon|P','1 tsp|gochugaru|I','1 tsp|rice vinegar|S'])],
 centre:[EGG_FRIED,
  O('Raw egg yolk','#f2a51b','yolk','Separate a very fresh egg and slip the yolk onto the hot rice just before serving.',['2|egg{s}|E']),
  EGG_JAMMY],
 sauce:[
  O('Gochujang sauce','#b8261b','s','Whisk gochujang, sesame oil, sugar, vinegar and a little water until smooth.',['2 tbsp|gochujang|I','1 tsp|sesame oil|S','1 tsp|sugar|S','1 tsp|rice vinegar|S']),
  O('Ssamjang','#7a4a22','s','Mix doenjang, gochujang, sesame oil and a little crushed garlic.',['1 tbsp|doenjang|I','1 tsp|gochujang|I','1 tsp|sesame oil|S']),
  O('Soy-sesame yangnyeom','#3b2414','s','Stir soy, gochugaru, sliced spring onion, sesame and a pinch of sugar.',['2 tbsp|soy sauce|S','0.5 tsp|gochugaru|I','1|spring onion{s}|P'])],
 garnish:[
  O('Sesame and gim','#1d271d','g','Snip roasted seaweed into strips and scatter with toasted sesame.',['5 g|roasted seaweed (gim)|I','1 tsp|toasted sesame seeds|S'],{mix:[['strip','#1d271d'],['dot','#f1e4c0']]}),
  O('Spring onion','#5a9a3a','g','Slice finely on the diagonal.',['2|spring onion{s}|P'],{mix:[['ring','#5a9a3a'],['ring','#b9d98a']]}),
  O('Gochugaru and sesame','#b32a16','g','Mix chilli flakes with toasted sesame seeds.',['0.5 tsp|gochugaru|I','1 tsp|toasted sesame seeds|S'],{mix:[['flake','#b32a16'],['dot','#f1e4c0']]})]},

{id:'chinese',n:'Chinese',sub:'Cantonese-leaning',style:'Char siu',glaze:'#8c1f14',
 mar:{how:'Whisk hoisin, soy, honey, Shaoxing wine, five spice and crushed garlic.',i:['2 tbsp|hoisin sauce|S','1 tbsp|soy sauce|S','1 tbsp|honey|S','1 tbsp|Shaoxing wine|I','0.5 tsp|Chinese five spice|S','2|garlic clove{s}|P']},
 base:[
  O('Steamed jasmine rice','#f5f2ea','rice','Rinse twice and cook with 1.25 parts water. Rest 10 minutes.',['1 cup|jasmine rice|R']),
  O('Ginger-scallion rice','#ecebd0','rice','Cook the rice, then fold through ginger and spring onion sizzled in hot oil.',['1 cup|jasmine rice|R','20 g|ginger|P','2|spring onion{s}|P'],{fleck:'#6aa34a'}),
  O('Egg fried rice','#f1d98c','rice','Use day-old rice. Scramble an egg in a smoking wok, add rice and soy, and toss until smoky.',['1 cup|jasmine rice|R','1|egg{s}|E','1 tbsp|soy sauce|S'],{fleck:'#f3b21e'})],
 veg:[
  O('Garlic gai lan','#2e6b3a','leaf','Blanch 1 minute, then toss with garlic oil and oyster sauce.',['1 bunch|gai lan|P','1|garlic clove{s}|P','1 tbsp|oyster sauce|S']),
  O('Smashed cucumber','#6fa860','chunk','Smash, cut into chunks, dress with black vinegar, garlic and chilli oil.',['1|Lebanese cucumber{s}|P','1 tbsp|Chinkiang black vinegar|I']),
  O('Baby bok choy','#7cb85a','leaf','Halve, then stir-fry 2 minutes with ginger and a splash of water.',['2|baby bok choy|P','10 g|ginger|P']),
  O('Wood ear mushrooms','#2a1c18','shred','Soak 20 minutes, trim, then dress with vinegar, soy and chilli.',['15 g|dried wood ear mushrooms|I','1 tsp|soy sauce|S']),
  O('Sichuan bean sprouts','#eee8c4','sprout','Stir-fry 30 seconds over high heat with a pinch of ground Sichuan pepper.',['150 g|mung bean sprouts|P','0.25 tsp|Sichuan pepper|I']),
  O('Snow peas','#8cc152','strip','Trim and stir-fry 1 minute with garlic until bright green.',['100 g|snow peas|P']),
  O('Wombok slaw','#e3eac6','shred','Shred finely and toss with rice vinegar, sesame oil and a pinch of sugar.',['0.25|wombok (Chinese cabbage)|P','1 tsp|rice vinegar|S']),
  O('Zha cai','#a8a24a','shred','Rinse the pickled mustard stem and slice thinly.',['50 g|zha cai (pickled mustard stem)|I']),
  O('Garlic eggplant','#5a2d5c','chunk','Cut into fingers, fry until soft, then glaze with garlic and soy.',['1|eggplant{s}|P'])],
 centre:[
  O('Crispy fried egg','#fbf7ec','eggx','Fry in plenty of hot oil, spooning it over until the edges go lacy and brown.',['2|egg{s}|E']),
  O('Soy-marinated egg','#c9935a','jammy','Boil 7 minutes, peel, then soak in soy, sugar and star anise for 2 hours.',['2|egg{s}|E','1|star anise|S']),

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const f=n=>(+n).toFixed(1);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);
function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rgb(hex){const n=parseInt(hex.slice(1),16);return[n>>16,n>>8&255,n&255]}
function shade(hex,a){const[r,g,b]=rgb(hex),t=a<0?0:255,p=Math.abs(a);const m=v=>Math.round(v+(t-v)*p);return`rgb(${m(r)},${m(g)},${m(b)})`}
function mix(h1,h2,p){const a=rgb(h1),b=rgb(h2);return'#'+a.map((v,i)=>Math.round(v+(b[i]-v)*p).toString(16).padStart(2,'0')).join('')}
const pickRand=a=>a[Math.floor(Math.random()*a.length)];
function sample(n,k){const a=[...Array(n).keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,k)}
function parseItem(s){const[q,name,a]=s.split('|');const p=q.trim().split(/\s+/);return{qty:parseFloat(p[0]),unit:p[1]||'',name,a}}
const PLURAL={cup:'cups',can:'cans',bunch:'bunches',jar:'jars'};
const FR={0.25:'¼',0.5:'½',0.75:'¾'};
function fmtQty(q,u){
  if(u==='g'||u==='ml'){const r=q>=100?Math.round(q/10)*10:Math.max(5,Math.round(q/5)*5);return r+' '+u}
  let v=Math.round(q*4)/4;if(v<=0)v=0.25;
  if(!u&&v>1)v=Math.ceil(v*2)/2;
  const w=Math.floor(v),fr=+(v-w).toFixed(2);
  const s=(w||'')+(FR[fr]||'');
  return s+(u?' '+(v>1&&PLURAL[u]?PLURAL[u]:u):'');
}
function fmtName(name,q,u){const many=!u&&q>1;return name.replace(/\{(\w+)\}/g,(_,s)=>many?s:'')}

/* ---------- state ---------- */
const st={cuisine:'korean',protein:'beef',serves:2,bowl:null,active:null,fresh:new Set(),checked:new Set()};
const cur=()=>CUISINES.find(c=>c.id===st.cuisine);
const VEG_SLOTS=5;
function newBowl(){const C=cur();return{base:Math.floor(Math.random()*C.base.length),veg:sample(C.veg.length,VEG_SLOTS),
  centre:Math.floor(Math.random()*C.centre.length),sauce:Math.floor(Math.random()*C.sauce.length),garnish:Math.floor(Math.random()*C.garnish.length)}}
function allFresh(){st.fresh=new Set(['base','protein','centre','sauce','garnish',...Array.from({length:VEG_SLOTS},(_,i)=>'veg'+i)])}
function slotOpt(slot){const C=cur(),b=st.bowl;
  if(slot==='protein')return proteinOpt();
  if(slot.startsWith('veg'))return C.veg[b.veg[+slot.slice(3)]];
  return C[slot][b[slot]]}
function proteinOpt(){const C=cur(),P=PROTEINS[st.protein];return{n:`${C.style} ${P.w}`,c:mix(P.c,C.glaze,.32),t:P.t}}
function curVal(slot){if(slot==='protein')return st.protein;if(slot.startsWith('veg'))return st.bowl.veg[+slot.slice(3)];return st.bowl[slot]}
function choices(slot){const C=cur();
  if(slot==='protein')return Object.keys(PROTEINS);
  if(slot.startsWith('veg'))return C.veg.map((_,i)=>i);
  return C[slot].map((_,i)=>i)}
function usedElsewhere(slot,val){if(!slot.startsWith('veg'))return false;const k=+slot.slice(3);return st.bowl.veg.some((v,j)=>j!==k&&v===val)}
function setSlot(slot,val){
  if(slot==='protein')st.protein=val;
  else if(slot.startsWith('veg'))st.bowl.veg[+slot.slice(3)]=+val;
  else st.bowl[slot]=+val;
  st.fresh.add(slot)}
function randomise(slot){const opts=choices(slot).filter(v=>v!==curVal(slot)&&!usedElsewhere(slot,v));if(opts.length)setSlot(slot,pickRand(opts))}

/* ---------- bowl drawing ---------- */
const CX=215,CY=212,RF=168,R1=62,R2=156;
const COUNTS={strip:150,leaf:125,chunk:70,cube:62,dot:230,slice:55,shred:210,sprout:110,mush:58,curl:46};
function sector(a0,a1,r1,r2){const p=(r,a)=>`${f(CX+r*Math.cos(a))} ${f(CY+r*Math.sin(a))}`;
  return`M${p(r1,a0)} L${p(r2,a0)} A${r2} ${r2} 0 0 1 ${p(r2,a1)} L${p(r1,a1)} A${r1} ${r1} 0 0 0 ${p(r1,a0)}Z`}
function shape(t,x,y,deg,col,R,base){
  const rot=`transform="rotate(${deg} ${f(x)} ${f(y)})"`;
  switch(t){
    case'strip':return`<rect x="${f(x-1.7)}" y="${f(y-9)}" width="3.4" height="18" rx="1.5" fill="${col}" ${rot}/>`;
    case'leaf':return`<ellipse cx="${f(x)}" cy="${f(y)}" rx="8.5" ry="3.8" fill="${col}" ${rot}/>`;
    case'chunk':return`<rect x="${f(x-7)}" y="${f(y-5.5)}" width="14" height="11" rx="3.5" fill="${col}" ${rot}/>`;
    case'cube':return`<rect x="${f(x-6.5)}" y="${f(y-6.5)}" width="13" height="13" rx="2" fill="${col}" stroke="${shade(base,-.25)}" stroke-width=".8" ${rot}/>`;
    case'dot':return`<circle cx="${f(x)}" cy="${f(y)}" r="${f(3+R()*1.2)}" fill="${col}"/>`;
    case'slice':return`<circle cx="${f(x)}" cy="${f(y)}" r="${f(7+R()*2)}" fill="${shade(base,.35)}" stroke="${col}" stroke-width="2.4"/>`;
    case'shred':{const l=8+R()*8;return`<line x1="${f(x)}" y1="${f(y)}" x2="${f(x+l)}" y2="${f(y+(R()-.5)*4)}" stroke="${col}" stroke-width="2.2" stroke-linecap="round" ${rot}/>`}
    case'sprout':return`<g ${rot}><path d="M${f(x)} ${f(y)} q6 -4 14 1" stroke="${col}" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="${f(x)}" cy="${f(y)}" rx="3.2" ry="2.4" fill="${shade(base,-.1)}"/></g>`;
    case'mush':return`<g ${rot}><ellipse cx="${f(x)}" cy="${f(y)}" rx="8.5" ry="6" fill="${col}"/><ellipse cx="${f(x)}" cy="${f(y+1)}" rx="4" ry="1.6" fill="${shade(base,.35)}"/></g>`;
    case'curl':return`<path d="M${f(x-6)} ${f(y)} a7 7 0 1 1 12 3" stroke="${col}" stroke-width="5.5" fill="none" stroke-linecap="round" ${rot}/>`;
  }return''}
function texture(t,c,seed,pt){const R=rng(seed);const cols=[c,shade(c,.14),shade(c,-.1),shade(c,.06)];let o='';
  const n=COUNTS[t]||100;for(let k=0;k<n;k++){const[x,y,th]=pt(R);const deg=(th*180/Math.PI+90+(R()-.5)*80).toFixed(0);o+=shape(t,x,y,deg,cols[k%4],R,c)}return o}
function blob(cx,cy,r,v,n,R){const p=[];for(let i=0;i<n;i++){const a=i/n*Math.PI*2,rr=r+(R()-.5)*v;p.push([cx+rr*Math.cos(a),cy+rr*Math.sin(a)])}
  let d='';for(let i=0;i<n;i++){const a=p[i],b=p[(i+1)%n];if(!i){const z=p[n-1];d+=`M${f((z[0]+a[0])/2)} ${f((z[1]+a[1])/2)}`}d+=` Q${f(a[0])} ${f(a[1])} ${f((a[0]+b[0])/2)} ${f((a[1]+b[1])/2)}`}return d+'Z'}
function yolk(x,y,r){return`<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="#f2a31a"/><circle cx="${f(x)}" cy="${f(y)}" r="${r*.62}" fill="#ee9312" opacity=".55"/><ellipse cx="${f(x-r*.35)}" cy="${f(y-r*.4)}" rx="${f(r*.3)}" ry="${f(r*.17)}" fill="#fff" opacity=".6"/>`}
function centreArt(o){const R=rng(hash(o.n));let s='';
  switch(o.t){
    case'egg':case'eggx':{const d=blob(CX,CY,50,12,14,R);
      s+=`<path d="${d}" fill="#fbf7ec" stroke="${o.t==='eggx'?'#b8782e':'#e2c58e'}" stroke-width="${o.t==='eggx'?5:2.5}" stroke-linejoin="round"/>`;
      if(o.t==='eggx')s+=`<path d="${d}" fill="none" stroke="#d9a65a" stroke-width="1.5" stroke-dasharray="3 5" transform="translate(${CX*.06} ${CY*.06}) scale(.94)"/>`;
      s+=yolk(CX+5,CY-3,17);break}
    case'yolk':s+=`<circle cx="${CX}" cy="${CY}" r="30" fill="#fbf7ec" opacity=".55"/>`+yolk(CX,CY,20);break;
    case'jammy':for(const dx of[-21,21]){s+=`<ellipse cx="${CX+dx}" cy="${CY}" rx="19" ry="27" fill="${o.c}" stroke="${shade(o.c,-.2)}" stroke-width="1.2"/><ellipse cx="${CX+dx}" cy="${CY+2}" rx="11" ry="14" fill="#f2a01e"/><ellipse cx="${CX+dx}" cy="${CY+2}" rx="6" ry="8" fill="#e47c0c"/>`}break;
    case'roll':for(const dx of[-26,0,26]){s+=`<rect x="${CX+dx-11}" y="${CY-17}" width="22" height="34" rx="5" fill="${o.c}" stroke="${shade(o.c,-.18)}" stroke-width="1.2"/><path d="M${CX+dx-6} ${CY-9} q8 0 8 8 q0 7 -6 7" stroke="${shade(o.c,-.2)}" fill="none" stroke-width="1.6"/>`}break;
    case'crumble':for(let i=0;i<38;i++){const a=R()*Math.PI*2,r=Math.sqrt(R())*42;s+=`<rect x="${f(CX+r*Math.cos(a)-4)}" y="${f(CY+r*Math.sin(a)-3.5)}" width="${f(6+R()*4)}" height="${f(5+R()*3)}" rx="2" fill="${i%3?o.c:'#e9e3d2'}" transform="rotate(${(R()*90).toFixed(0)} ${f(CX+r*Math.cos(a))} ${f(CY+r*Math.sin(a))})"/>`}break;
    case'blob':for(let i=0;i<20;i++){const a=R()*Math.PI*2,r=Math.sqrt(R())*38;s+=`<path d="${blob(CX+r*Math.cos(a),CY+r*Math.sin(a),7,4,7,R)}" fill="${i%2?o.c:shade(o.c,.25)}"/>`}
      for(let i=0;i<8;i++){const a=R()*Math.PI*2,r=Math.sqrt(R())*36;s+=`<circle cx="${f(CX+r*Math.cos(a))}" cy="${f(CY+r*Math.sin(a))}" r="2.6" fill="#c8361e"/>`}break;
    case'disc':for(const[dx,dy]of[[-16,-6],[16,8]]){s+=`<circle cx="${CX+dx}" cy="${CY+dy}" r="24" fill="${o.c}" stroke="${shade(o.c,-.28)}" stroke-width="3"/><ellipse cx="${CX+dx-7}" cy="${CY+dy-8}" rx="8" ry="4" fill="#fff" opacity=".25"/>`}break;
  }return s}
function garnishArt(g){const R=rng(hash(g.n)+7);let s='';const m=g.mix||[['dot',g.c]];
  for(let i=0;i<54;i++){const[t,c]=m[i%m.length];const a=R()*Math.PI*2,r=26+Math.sqrt(R())*(RF-36),x=CX+r*Math.cos(a),y=CY+r*Math.sin(a),deg=(R()*180).toFixed(0);
    const rot=`transform="rotate(${deg} ${f(x)} ${f(y)})"`;
    if(t==='dot')s+=`<ellipse cx="${f(x)}" cy="${f(y)}" rx="2.2" ry="1.4" fill="${c}" ${rot}/>`;
    else if(t==='strip')s+=`<rect x="${f(x-1)}" y="${f(y-7)}" width="2" height="14" rx="1" fill="${c}" ${rot}/>`;
    else if(t==='leaf')s+=`<ellipse cx="${f(x)}" cy="${f(y)}" rx="4.4" ry="2.2" fill="${c}" ${rot}/>`;
    else if(t==='ring')s+=`<circle cx="${f(x)}" cy="${f(y)}" r="2.8" fill="none" stroke="${c}" stroke-width="1.6"/>`;
    else s+=`<rect x="${f(x-2.5)}" y="${f(y-1.8)}" width="5" height="3.6" rx="1" fill="${c}" ${rot}/>`}
  return s}
function bowlSVG(){
  const C=cur(),b=st.bowl,base=C.base[b.base];const R=rng(hash(base.n));
  let defs='',body='';
  // stone bowl
  body+=`<ellipse cx="${CX}" cy="${CY+196}" rx="170" ry="16" style="fill:var(--shadow)"/>`;
  body+=`<circle cx="${CX}" cy="${CY}" r="203" fill="url(#stoneG)"/><circle cx="${CX}" cy="${CY}" r="199" fill="none" style="stroke:var(--stone-hi)" stroke-width="2" opacity=".7"/>`;
  body+=`<circle cx="${CX}" cy="${CY}" r="180" style="fill:var(--stone-lo)"/>`;
  // rice
  const fresh=s=>st.fresh.has(s)?' pop':'';
  let rice=`<circle cx="${CX}" cy="${CY}" r="${RF}" fill="${base.c}"/>`;
  for(let i=0;i<260;i++){const a=R()*Math.PI*2,r=Math.sqrt(R())*(RF-4),x=CX+r*Math.cos(a),y=CY+r*Math.sin(a);
    rice+=`<ellipse cx="${f(x)}" cy="${f(y)}" rx="3" ry="1.4" fill="${shade(base.c,i%2?.25:-.07)}" transform="rotate(${(R()*180).toFixed(0)} ${f(x)} ${f(y)})"/>`}
  if(base.fleck)for(let i=0;i<(base.big?26:44);i++){const a=R()*Math.PI*2,r=Math.sqrt(R())*(RF-6),x=CX+r*Math.cos(a),y=CY+r*Math.sin(a);
    rice+=base.big?`<ellipse cx="${f(x)}" cy="${f(y)}" rx="5" ry="3" fill="${base.fleck}" transform="rotate(${(R()*180).toFixed(0)} ${f(x)} ${f(y)})"/>`
      :`<ellipse cx="${f(x)}" cy="${f(y)}" rx="2.8" ry="1.5" fill="${base.fleck}" transform="rotate(${(R()*180).toFixed(0)} ${f(x)} ${f(y)})"/>`}
  body+=`<g class="base-g${fresh('base')}" data-act="open" data-slot="base" style="cursor:pointer" aria-hidden="true">${rice}</g>`;
  // wedges
  const slots=['protein',...Array.from({length:VEG_SLOTS},(_,i)=>'veg'+i)];
  const step=Math.PI*2/slots.length,gap=.05;
  slots.forEach((slot,i)=>{
    const o=slotOpt(slot),mid=-Math.PI/2+i*step,a0=mid-step/2+gap,a1=mid+step/2-gap;
    const d=sector(a0,a1,R1,R2);defs+=`<clipPath id="cp${i}"><path d="${d}"/></clipPath>`;
    const pt=Rr=>{const r=Math.sqrt(Rr()*(R2*R2-R1*R1)+R1*R1),th=a0-.05+Rr()*(a1-a0+.1);return[CX+r*Math.cos(th),CY+r*Math.sin(th),th]};
    const tex=texture(o.t,o.c,hash(o.n+slot.length),pt);
    const dx=(Math.cos(mid)*7).toFixed(1),dy=(Math.sin(mid)*7).toFixed(1);
    const on=st.active===slot?' on':'';
    body+=`<g class="seg${on}${fresh(slot)}" style="--dx:${dx}px;--dy:${dy}px" data-act="open" data-slot="${slot}" tabindex="0" role="button" aria-label="${esc(o.n)}. Choose to swap">
      <path d="${d}" fill="${shade(o.c,-.2)}" stroke="${shade(o.c,-.2)}" stroke-width="5" stroke-linejoin="round"/>
      <g clip-path="url(#cp${i})">${tex}</g>
      <path class="ring" d="${d}" stroke-linejoin="round"/></g>`});
  // centre
  const cen=C.centre[b.centre];
  body+=`<g class="seg${st.active==='centre'?' on':''}${fresh('centre')}" data-act="open" data-slot="centre" tabindex="0" role="button" aria-label="${esc(cen.n)}. Choose to swap">
    <circle cx="${CX}" cy="${CY}" r="56" fill="transparent"/>${centreArt(cen)}<circle class="ring" cx="${CX}" cy="${CY}" r="56"/></g>`;
  // garnish
  body+=`<g class="${fresh('garnish').trim()}" pointer-events="none">${garnishArt(C.garnish[b.garnish])}</g>`;
  // sauce ramekin
  const sau=C.sauce[b.sauce],sx=402,sy=366;
  body+=`<g class="seg${st.active==='sauce'?' on':''}${fresh('sauce')}" style="--dx:3px;--dy:3px" data-act="open" data-slot="sauce" tabindex="0" role="button" aria-label="${esc(sau.n)}. Choose to swap">
    <ellipse cx="${sx+4}" cy="${sy+44}" rx="40" ry="7" style="fill:var(--shadow)"/>
    <circle cx="${sx}" cy="${sy}" r="48" fill="url(#stoneG)"/><circle cx="${sx}" cy="${sy}" r="38" fill="${sau.c}"/>
    <path d="M${sx-26} ${sy-12} a28 28 0 0 1 22 -20" stroke="#fff" stroke-opacity=".35" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle class="ring" cx="${sx}" cy="${sy}" r="48"/></g>`;
  const label=`${C.style} ${PROTEINS[st.protein].w} bibimbap in a stone bowl`;
  return`<svg class="bowl" viewBox="0 0 460 440" role="group" aria-label="${esc(label)}"><defs>
    <radialGradient id="stoneG" cx="40%" cy="35%" r="70%"><stop offset="0" style="stop-color:var(--stone-hi)"/><stop offset=".55" style="stop-color:var(--stone)"/><stop offset="1" style="stop-color:var(--stone-lo)"/></radialGradient>
    ${defs}</defs>${body}</svg>`}

/* ---------- panels ---------- */
const DICE=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>`;
function rows(){return[['base','Base'],['protein','Protein'],...Array.from({length:VEG_SLOTS},(_,i)=>['veg'+i,'Topping']),['centre','Centre'],['sauce','Sauce'],['garnish','Garnish']]}
function legendHTML(){const C=cur();
  return rows().map(([slot,cat])=>{const o=slotOpt(slot),on=st.active===slot;
    let alts='';
    if(on){const list=choices(slot).map(v=>{const opt=slot==='protein'?PROTEINS[v]:(slot.startsWith('veg')?C.veg[v]:C[slot][v]);
        const sel=v===curVal(slot),used=usedElsewhere(slot,v);
        const col=slot==='protein'?mix(opt.c,C.glaze,.32):opt.c;
        return`<button type="button" class="alt" data-act="pick" data-slot="${slot}" data-val="${v}" aria-pressed="${sel}" ${used?'disabled title="Already in the bowl"':''}><i style="background:${col}"></i>${esc(opt.n)}</button>`}).join('');
      const prep=slot==='protein'?PROTEINS[st.protein].cut:o.p;
      alts=`<p class="prep">${esc(prep)}</p><div class="alts" role="group" aria-label="Swap ${esc(cat.toLowerCase())}">${list}</div>`}
    return`<li class="${on?'on':''}" data-row="${slot}"><div class="rowtop">
      <button type="button" class="open" data-act="open" data-slot="${slot}" aria-expanded="${on}"><span class="sw" style="background:${o.c}"></span><span style="min-width:0"><span class="cat">${cat}</span><span class="nm">${esc(o.n)}</span></span></button>
      <button type="button" class="dice" data-act="rand" data-slot="${slot}" aria-label="Randomise ${esc(o.n)}">${DICE}</button></div>${alts}</li>`}).join('')}

function gather(){const C=cur(),b=st.bowl,P=PROTEINS[st.protein];
  const src=[...C.base[b.base].i,...P.i,...C.mar.i,...b.veg.flatMap(v=>C.veg[v].i),...C.centre[b.centre].i,...C.sauce[b.sauce].i,...C.garnish[b.garnish].i];
  const map=new Map();for(const s of src){const it=parseItem(s);const k=it.name+'|'+it.unit;const e=map.get(k);if(e)e.qty+=it.qty;else map.set(k,{...it,key:k})}
  const k=st.serves/2;return[...map.values()].map(it=>{const q=it.qty*k;return{...it,q,label:fmtQty(q,it.unit),nm:fmtName(it.name,q,it.unit)}})}
function shopHTML(items){return AISLE_ORDER.map(a=>{const its=items.filter(i=>i.a===a);if(!its.length)return'';
  return`<div class="aisle"><h3>${AISLES[a]}</h3><ul class="shop">${its.map(i=>{const id='c'+hash(i.key);
    return`<li><label for="${id}"><input type="checkbox" id="${id}" data-key="${esc(i.key)}" ${st.checked.has(i.key)?'checked':''}><span class="q">${esc(i.label)}</span><span>${esc(i.nm)}</span></label></li>`}).join('')}</ul></div>`}).join('')}
function shopText(items){return`${$('#title').textContent} (serves ${st.serves})\n`+AISLE_ORDER.map(a=>{const its=items.filter(i=>i.a===a);if(!its.length)return'';
  return`\n${AISLES[a].toUpperCase()}\n`+its.map(i=>`- ${i.label} ${i.nm}`).join('\n')}).join('\n')}
function stepsHTML(){const C=cur(),b=st.bowl,P=PROTEINS[st.protein];
  const base=C.base[b.base],cen=C.centre[b.centre],sau=C.sauce[b.sauce],gar=C.garnish[b.garnish];
  const S=[];
  S.push([`Start the ${lc(base.n)}`,base.p]);
  S.push([`Make the ${lc(C.style)} marinade`,`${C.mar.how} ${P.cut} ${P.plant?'Keep the marinade aside for the end.':`Toss the ${P.w} through it and leave it while you prep everything else.`}`]);
  S.push([`Mix the ${lc(sau.n)}`,sau.p]);
  S.push(['Prep the toppings',null,b.veg.map(v=>C.veg[v])]);
  S.push([`Cook the ${P.w}`,P.cook+(P.plant?' Pour in the marinade for the last minute and toss until sticky and glazed.':'')]);
  S.push([cen.n,cen.p]);
  S.push(['Build the bowls',`Spread the rice in warm bowls. Arrange the ${P.w} and each topping in its own segment around the edge, then set the ${lc(cen.n)} in the middle. Finish with ${lc(gar.n)}: ${lc(gar.p)}`]);
  S.push(['Mix and eat',`Serve the ${lc(sau.n)} on the side, spoon on as much as you like, and stir everything together.`]);
  return S.map(([h,p,list])=>`<li><div><h4>${esc(h)}</h4>${p?`<p>${esc(p)}</p>`:''}${list?`<ul>${list.map(v=>`<li><strong>${esc(v.n)}.</strong> ${esc(v.p)}</li>`).join('')}</ul>`:''}</div></li>`).join('')}

/* ---------- render ---------- */
function controls(){
  $('#cuisines').innerHTML=CUISINES.map(c=>`<label class="chip"><input type="radio" name="cuisine" id="cu-${c.id}" value="${c.id}" ${c.id===st.cuisine?'checked':''}><span>${c.n}</span></label>`).join('');
  $('#proteins').innerHTML=Object.entries(PROTEINS).map(([k,p])=>`<label class="chip"><input type="radio" name="protein" id="pr-${k}" value="${k}" ${k===st.protein?'checked':''}><span>${p.n}</span></label>`).join('');
}
function render(){
  const C=cur(),P=PROTEINS[st.protein];
  document.querySelectorAll('input[name=protein]').forEach(i=>i.checked=i.value===st.protein);
  document.querySelectorAll('input[name=cuisine]').forEach(i=>i.checked=i.value===st.cuisine);
  $('#serves').textContent=st.serves;
  $('#eyebrow').textContent=`${C.n} · ${C.sub}`;
  $('#title').textContent=`${C.style} ${P.w} bibimbap`;
  const items=gather();
  $('#meta').textContent=`Serves ${st.serves} · ${VEG_SLOTS+1} segments · ${items.length} ingredients`;
  $('#bowlWrap').innerHTML=bowlSVG();
  $('#legend').innerHTML=legendHTML();
  $('#shop').innerHTML=shopHTML(items);
  $('#steps').innerHTML=stepsHTML();
  $('#copybox').hidden=true;
  st.fresh.clear();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const slot=el.dataset.slot,act=el.dataset.act;
  if(act==='open'){st.active=st.active===slot?null:slot;render();focusRow(slot,el.closest('svg')?false:true)}
  else if(act==='rand'){randomise(slot);st.active=slot;render();focusRow(slot,true,'.dice')}
  else if(act==='pick'){const v=slot==='protein'?el.dataset.val:+el.dataset.val;setSlot(slot,v);render();focusRow(slot,true,`.alt[data-val="${el.dataset.val}"]`)}
});
document.addEventListener('keydown',e=>{const g=e.target.closest&&e.target.closest('g.seg');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();g.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
function focusRow(slot,focus,sel='.open'){const li=document.querySelector(`[data-row="${slot}"]`);if(!li)return;
  li.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
  if(focus){const t=li.querySelector(sel);t&&t.focus({preventScroll:true})}}
document.addEventListener('change',e=>{const t=e.target;
  if(t.name==='cuisine'){st.cuisine=t.value;st.bowl=newBowl();st.active=null;allFresh();render()}
  else if(t.name==='protein'){st.protein=t.value;st.fresh.add('protein');render()}
  else if(t.dataset.key){t.checked?st.checked.add(t.dataset.key):st.checked.delete(t.dataset.key)}});
$('#shuffle').addEventListener('click',()=>{st.bowl=newBowl();st.active=null;allFresh();render()});
$('#less').addEventListener('click',()=>{if(st.serves>1){st.serves--;render()}});
$('#more').addEventListener('click',()=>{if(st.serves<8){st.serves++;render()}});
$('#copy').addEventListener('click',()=>{const txt=shopText(gather()),btn=$('#copy');
  const fallback=()=>{const box=$('#copybox');box.value=txt;box.hidden=false;box.focus();box.select();btn.textContent='Select and copy below'};
  try{navigator.clipboard.writeText(txt).then(()=>{btn.textContent='Copied';setTimeout(()=>btn.textContent='Copy list',1800)},fallback)}catch(err){fallback()}});

/* ---------- start ---------- */
controls();
st.bowl={base:0,veg:[0,1,2,4,5],centre:0,sauce:0,garnish:0};
render();
</script>
</body>
</html>
